version: 2

updates:
  # Npm dependecies updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      devDependencies:
        dependency-type: "development"
      dependencies:
        dependency-type: "production"

  # Release tooling updates, kept out of the main dependency tree
  - package-ecosystem: "npm"
    directory: "/.github/release-tools"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
